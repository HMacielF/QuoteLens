# Deploys the static frontend (index.html, css/, js/, assets/) to the quotelensapp Web App
# whenever those files change on main. The backend in api/ deploys separately to the
# quotelens-api-hmf Function App and is never copied to the website.
#
# Started from the workflow Azure's Deployment Center generated. That version ran npm, but the
# frontend has no package.json, so the first run failed. Azure sign-in uses OpenID Connect
# with the secrets Deployment Center created; no passwords are stored.

name: Deploy frontend to quotelensapp

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - '.github/workflows/main_quotelensapp.yml'
  workflow_dispatch:

# A newer push to main cancels a deploy that has not finished yet.
concurrency:
  group: deploy-quotelensapp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed to sign in to Azure with OpenID Connect
      contents: read  # Needed to check out the repository

    steps:
      - uses: actions/checkout@v4

      - name: Collect the website files
        run: |
          mkdir site
          cp index.html site/
          for dir in css js assets; do
            if [ -d "$dir" ]; then cp -r "$dir" site/; fi
          done
          echo "Files to deploy:"
          find site -type f | sort

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_61939F45DB7A413DBF7F1A57C1F8A4F1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F2211AC6EF2F452FA64FCDAD998C1BCD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7663082315074498955F7C5730E21EC4 }}

      - name: Deploy to the quotelensapp Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'quotelensapp'
          slot-name: 'Production'
          package: site
          # The Web App runs Node 22 on Linux. pm2 comes with that image and serves the
          # folder as a static website, so no Node server code is needed.
          startup-command: 'pm2 serve /home/site/wwwroot --no-daemon'

      - name: Check the site responds
        run: |
          url="${{ steps.deploy-to-webapp.outputs.webapp-url }}"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url/")
            echo "Attempt $attempt: $url returned $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "The site did not return 200 after deploying."
          exit 1
