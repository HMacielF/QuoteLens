<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Counter</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #1e1b2e; }
    h1 { color: #6644a8; margin-bottom: 4px; }
    .count { font-size: 72px; font-weight: 700; margin: 24px 0 8px; }
    button { font-size: 20px; padding: 12px 28px; border: 0; border-radius: 8px; background: #6644a8; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .error { color: #c4514c; }
    .small { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Team Counter</h1>
  <p class="small">Website version: <strong>1</strong></p>

  <p class="count" id="count">…</p>
  <button id="addButton" disabled>Add 1</button>
  <p id="message" class="small"></p>

  <h2>Our team</h2>
  <!-- Each teammate adds their own name here, then commits and pushes. -->
  <ul>
    <li>Your name here</li>
  </ul>

  <p class="small">API: <span id="apiShown">loading…</span> · API version: <span id="apiVersion">?</span></p>

  <script>
    let API_BASE = "";

    const $ = (id) => document.getElementById(id);

    function showError(text) {
      $("message").textContent = text;
      $("message").className = "error";
    }

    // Calls one function on the API and returns its JSON answer.
    async function callApi(functionName, method) {
      const url = API_BASE + "/" + functionName;
      let response;
      try {
        response = await fetch(url, { method: method });
      } catch (networkError) {
        throw new Error("Could not reach the API at " + url +
          ". Check the API_BASE setting on the Web App and CORS on the Function App.");
      }
      let data;
      try {
        data = await response.json();
      } catch (notJson) {
        throw new Error("Expected JSON from " + url + " but got something else (status " +
          response.status + "). API_BASE must be your Function App's address ending in /api.");
      }
      if (!response.ok) {
        throw new Error(data.error || ("The API answered with status " + response.status));
      }
      return data;
    }

    function show(data) {
      $("count").textContent = data.count;
      $("apiVersion").textContent = data.apiVersion;
    }

    async function start() {
      // 1. Ask our own web server where the API lives (the API_BASE app setting).
      try {
        const config = await (await fetch("/config")).json();
        API_BASE = (config.apiBase || "").replace(/\/+$/, "");
      } catch (e) {
        API_BASE = "";
      }
      $("apiShown").textContent = API_BASE || "(not set)";
      if (!API_BASE) {
        showError("API_BASE is not set. Add it to the Web App's app settings: your Function App's address ending in /api.");
        return;
      }

      // 2. Read the current count.
      try {
        show(await callApi("getCount", "GET"));
        $("addButton").disabled = false;
      } catch (error) {
        showError(error.message);
      }
    }

    $("addButton").addEventListener("click", async () => {
      $("addButton").disabled = true;
      try {
        show(await callApi("addOne", "POST"));
        $("message").textContent = "";
      } catch (error) {
        showError(error.message);
      }
      $("addButton").disabled = false;
    });

    start();
  </script>
</body>
</html>
